services:
  dic-web:
    build: .
    restart: unless-stopped
    env_file: .env                     # salin dari example.env
    environment:                       # prioritas di atas env_file: data wajib berada di volume
      DB_PATH: /data/dic.db
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]     # reverse proxy HTTPS (Caddy/Nginx) berada di depan port ini
    volumes: ["dic-data:/data"]
volumes:
  dic-data:
