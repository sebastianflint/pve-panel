name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax JS dan template EJS
        run: npm run lint:syntax
      - name: Tes end-to-end
        run: npm test
      - name: Audit dependency (production, high ke atas)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build dan smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dic-web:ci .
      - name: Jalankan container (mode production)
        run: |
          docker run -d --name dic -p 3000:3000 \
            -e NODE_ENV=production -e BASE_URL=http://localhost:3000 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL=admin@ci.local -e ADMIN_PASSWORD="$(openssl rand -hex 12)" \
            dic-web:ci
      - name: Tunggu siap
        run: |
          for i in $(seq 1 40); do curl -fs http://localhost:3000/robots.txt >/dev/null && exit 0; sleep 1; done
          docker logs dic; exit 1
      - name: Smoke test
        run: |
          set -e
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1"); [ "$code" = "$2" ] || { echo "$1 -> $code (harap $2)"; docker logs dic; exit 1; }; echo "ok $1 $code"; }
          check / 200; check /en 200; check /tentang 200; check /en/about 200; check /lini-bisnis 200; check /berita 200
          check /kontak 200; check /en/contact 200; check /unduh/1 200; check /sitemap.xml 200
          check /admin 302; check /admin/login 200; check /tidak-ada 404
          curl -s http://localhost:3000/robots.txt | grep -q "Disallow: /"   # belum launch_ready
          curl -sI http://localhost:3000/ | grep -qi "content-security-policy"
      - name: Cek konfigurasi production wajib SESSION_SECRET
        run: |
          if docker run --rm -e NODE_ENV=production dic-web:ci node src/server.js 2>&1 | grep -q "SESSION_SECRET wajib"; then echo "ok: menolak start tanpa SESSION_SECRET"; else echo "server start tanpa SESSION_SECRET"; exit 1; fi
      - name: Log container
        if: always()
        run: docker logs dic | tail -30
