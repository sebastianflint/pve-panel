# Alternatif Nginx. Sertifikat TLS dikelola certbot (certbot --nginx -d dic.id -d www.dic.id).
server {
    listen 80;
    server_name dic.id www.dic.id;
    return 301 https://dic.id$request_uri;
}
server {
    listen 443 ssl http2;
    server_name dic.id;
    # ssl_certificate dan ssl_certificate_key ditambahkan certbot
    client_max_body_size 12m;
    gzip on; gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
